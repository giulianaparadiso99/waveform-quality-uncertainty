# Default configuration for the waveform quality uncertainty project.
# Relative paths are resolved against the project root (the parent of configs/).

data:
  # "seisbench": load the ESM25 benchmark datasets through SeisBench (downloads
  #              metadata and waveforms into SEISBENCH_CACHE_ROOT on first use).
  # "local_csv": read only the metadata CSV files from local_metadata_dir
  #              (development mode, no waveforms available).
  source: local_csv
  local_metadata_dir: ~/tmp_esm25
  # Fixed waveform length of ESM25 traces (84000 samples at 200 Hz).
  waveform_length_s: 420.0
  # Name of the metadata file inside each SeisBench dataset folder.
  seisbench_metadata_file: metadata.csv
  # Keyword arguments passed to the SeisBench dataset constructors.
  dataset_options: {}
  # Label convention: 1 marks the bad-quality class, 0 the good-quality class.
  subsets:
    - name: good
      seisbench_class: ESM25GoodCV
      repository_name: esm25goodcv
      local_metadata_file: metadata_goodcv.csv
      label: 0
    - name: bad
      seisbench_class: ESM25BadCV
      repository_name: esm25badcv
      local_metadata_file: metadata_badcv.csv
      label: 1

columns:
  # Columns added by the loading step.
  label: label
  subset: subset
  subset_index: subset_index
  station_id: station_id
  # Existing ESM25 columns.
  event_id: source_esm_id
  # Columns read as text to preserve codes such as "00" or "001".
  text:
    - source_esm_id
    - source_isc_id
    - source_usgs_id
    - source_ingv_id
    - source_emsc_id
    - station_network_code
    - station_code
    - station_location_code
    - station_channel_code
    - trace_u_channel_code
    - trace_v_channel_code
    - trace_w_channel_code
    - trace_name
    - trace_name_old
  # Columns parsed as UTC timestamps.
  datetime:
    - source_esm_origin_time
    - trace_start_time
    - trace_start_time_orig_cv_u
    - trace_end_time_orig_cv_u
    - trace_start_time_orig_cv_v
    - trace_end_time_orig_cv_v
    - trace_start_time_orig_cv_w
    - trace_end_time_orig_cv_w
  # Preferred magnitude: first available value in this order (as in ESM25 notebook 09).
  magnitude_priority:
    - source_magnitude_emec_mw
    - source_magnitude_mw
    - source_magnitude_ml
    - source_magnitude_ms
    - source_magnitude_mb
    - source_magnitude_md
    - source_magnitude_m

exploration:
  # Features available before the quality review, grouped by interpretation.
  feature_groups:
    - name: physical
      numeric:
        - preferred_magnitude
        - source_depth_km
        - path_epi_dist_km
        - path_hyp_dist_km
        - max_unprocessed_pga_cps2
        - station_preferred_vs30_mps
      categorical:
        - station_preferred_ec8_code
    - name: acquisition
      numeric:
        - origin_year
        - original_sampling_rate_hz
        - original_duration_s
        - recording_span_s
        - component_start_spread_s
      categorical:
        - station_network_code
        - station_id
        - station_instrument_type_code
        - station_nation_code
        - original_data_mediator
        - preferred_magnitude_type
  # Columns that encode or follow the quality decision, or identify records.
  excluded_columns:
    - trace_processing_status
    - trace_processing_type
    - trace_name
    - trace_name_old
    - source_esm_id
    - web_availability_code
    - trace_late_triggered_event_01
    - trace_has_padding_cv
  # Pairs (variable, stratum) for stratified bad-rate tables.
  stratified_comparisons:
    - variable: original_sampling_rate_hz
      stratum: station_network_code
    - variable: origin_year
      stratum: station_network_code
    - variable: recording_span_s
      stratum: preferred_magnitude
  # Cross-validation folds for out-of-fold encoding of categorical features.
  n_splits: 5
  # Pseudo-count pulling rare categories towards the global bad rate.
  target_encoding_smoothing: 20.0
  # Number of quantile bins used when a numeric variable is stratified.
  n_quantile_bins: 5
  # Number of most frequent categories kept in tables and plots.
  top_categories: 12
  # Numeric columns with at most this many distinct values are treated as categories
  # in stratified tables (e.g. original sampling rate); others are binned by quantiles.
  max_discrete_levels: 20
  # Minimum number of records for a cell of a stratified table to be shown.
  min_stratum_count: 30
  # Source-path and spatial overview.
  spatial:
    magnitude_column: preferred_magnitude
    distance_column: path_hyp_dist_km
    year_column: origin_year
    station_latitude_column: station_latitude_deg
    station_longitude_column: station_longitude_deg
    event_latitude_column: source_latitude_deg
    event_longitude_column: source_longitude_deg
    # Bins of the magnitude-distance bad-rate map (distance bins are logarithmic).
    magnitude_bins: {start: 2.0, stop: 8.5, step: 0.25}
    distance_bins_km: {start: 1.0, stop: 1000.0, n_bins: 24}
    # Map extent [lon_min, lon_max, lat_min, lat_max] in degrees; null computes it from the data.
    # ESM25 also contains a few records outside Europe, which would make an automatic extent global.
    map_extent_deg: [-30.0, 60.0, 25.0, 70.0]
    # Margin around the data when the map extent is computed automatically.
    map_margin_deg: 1.0
    # Draw coastlines and borders (Natural Earth data, downloaded by cartopy on first use).
    show_geography: true
  # Number of example records per class for waveform inspection.
  n_waveform_examples: 2
  random_seed: 42

waveforms:
  # Where the waveform inspection reads the traces:
  # "dev_subset": local development subset built from traces read on the SeisBench server
  #               (HTTP range requests, no full download needed);
  # "seisbench":  full datasets in the SeisBench cache (after the complete download).
  source: dev_subset
  # Remote waveform file of a dataset; {repository_name} is replaced per subset.
  remote_url_template: https://hifis-storage.desy.de/Helmholtz/HelmholtzAI/SeisBench/datasets/{repository_name}/waveforms.hdf5
  dev_subset_file: data/dev_subset/waveforms.h5
  dev_subset_records_file: data/dev_subset/records.csv
  dev_subset_records_per_class: 1000
  # Records drawn from the same event, at most (more events = more variety).
  dev_subset_max_records_per_event: 1
  # Records per class used by the inspection; null uses every record of the source.
  inspection_records_per_class: null
  # Number of traces read and analysed together.
  batch_size: 128
  # Absolute amplitude at or below which a sample counts as zero (0.0 = exact zeros only).
  zero_tolerance: 0.0
  # Shortest run of zeros inside the recorded signal reported as a data gap.
  min_internal_gap_s: 0.5
  # Welch spectra used to compare traces by original sampling rate.
  spectrum_segment_s: 20.48
  # Number of original sampling rates shown in the spectrum comparison (most frequent first).
  spectrum_top_sampling_rates: 4
  random_seed: 42

preprocessing:
  # Analysis window placed around an anchor time, the same for the three components.
  window:
    # Anchoring method (parameters in `anchoring` below): envelope = maximum of the energy envelope
    # of the three components, insensitive to isolated spikes (chosen after inspecting the gallery of
    # notebook 02). Others: pga, arias, theoretical, hybrid. Records where the method finds no anchor
    # fall back to the PGA.
    anchor: envelope
    pre_anchor_s: 30.0
    post_anchor_s: 90.0
    # Extra data on each side used by the transforms and discarded afterwards (edge effects).
    # Must be at least half the STFT window and the Morlet wavelet half-width at min_frequency_hz.
    context_margin_s: 20.0
    # Fraction of the analysed segment (window plus margins) tapered at each end (Tukey window).
    taper_fraction: 0.05
  # Grid search over the window (notebook 02): the suggested values are printed, the window used
  # by the preprocessing is always the one in `window` above.
  window_search:
    pre_anchor_s: [10, 20, 30, 40, 50, 60]
    post_anchor_s: [30, 45, 60, 90, 120, 150, 180, 240]
    # Leakage criterion: the zero padding inside the window must not separate the classes.
    # Separation = max(AUC, 1 - AUC), 0.5 = no information. Tested on the seconds of padding before
    # the anchor, after the anchor and in total (worst component), and with a classifier that sees only the
    # padding (seconds per component and padding fraction per time bin and component), evaluated out
    # of fold with folds grouped by event. A window is accepted when all separations are at most
    # max_separation (standard error of the AUC with 1000 records per class: about 0.013).
    leakage:
      max_separation: 0.55
      # Records with a component entirely without data are a real defect, not an effect of the window.
      exclude_empty_components: true
      classifier:
        n_splits: 5
        mask_bins: 32
        random_seed: 42
        # Label permutations giving the separation reached when the padding carries no class
        # information (reference for max_separation).
        n_permutations: 20
    # Signal-loss criterion: fraction of the energy (sum of squared amplitudes over the three
    # components) of the stored trace that falls inside the window.
    energy:
      # Records on which the energy kept is measured (0 = good: in bad records much of the energy
      # can be noise outside the event, so their energy kept is not a measure of a good window).
      reference_label: 0
      # quantile: the `quantile`-th quantile of the energy fraction kept (0.1 = kept by 90% of records);
      # share_above: share of records keeping at least `min_fraction` of their energy.
      criterion: quantile
      quantile: 0.1
      min_fraction: 0.95
    # Among accepted windows, those within this amount of the best energy score are equivalent:
    # the shortest one is suggested.
    score_tolerance: 0.005
  # Parameters of the anchoring methods; `methods` lists those compared in notebook 02.
  anchoring:
    # Any of: pga, envelope, arias, theoretical, hybrid.
    methods: [pga, envelope, arias, theoretical, hybrid]
    # Moving-average length of the energy envelope (sum of squared amplitudes of the three components).
    envelope_window_s: 2.0
    # Arias anchor: time at which this fraction of the energy has arrived (0.05 = onset of the strong
    # motion, 0.5 = centre of the energy).
    arias_fraction: 0.5
    # Theoretical arrival: origin time + distance / velocity (3.5 km/s: S waves in the crust).
    theoretical:
      distance_column: path_hyp_dist_km
      phase_velocity_km_s: 3.5
    # Hybrid: maximum of the energy envelope within this distance of the theoretical arrival.
    hybrid_search_half_width_s: 20.0
    # Two anchors disagree when they differ by more than this.
    agreement_tolerance_s: 10.0
    # Records per class shown where the configured anchor and the PGA disagree.
    n_examples_per_class: 3
    # Random records per class in the gallery (one PDF per class) showing the window of every method.
    gallery_records_per_class: 30
  resampling:
    target_sampling_rate_hz: 100.0
    # Zero-phase Butterworth low-pass applied before resampling.
    antialias_corner_hz: 40.0
    antialias_order: 6
  # Common time-frequency grid of spectrograms and scalograms.
  grid:
    min_frequency_hz: 0.1
    max_frequency_hz: 40.0
    n_frequencies: 128
    n_times: 128
  stft:
    # Window length = window_cycles / min_frequency_hz (1 cycle: frequency resolution equal to min_frequency_hz).
    window_cycles: 1.0
    window_type: hann
  cwt:
    # Morlet parameter: trade-off between time and frequency resolution.
    morlet_w0: 6.0
  decibel:
    # Power reference of the decibel scale (absolute, identical for all records).
    reference_power: 1.0
    # Power assigned to zero or tiny values before the logarithm. Chosen from the power distributions
    # of notebook 02: real values lie above about -120 dB, filter artefacts and missing data below.
    floor_power: 1.0e-12
  # Number of records whose power values are pooled to inspect the decibel distributions.
  n_distribution_records: 200
  # The plot of the power distributions starts this many dB below the floor.
  distribution_plot_margin_db: 80.0
  # Number of records per class saved as PNG images for visual inspection.
  n_png_records_per_class: 5
  output_dir: data/processed
  figures_dir: outputs/figures/02_preprocessing
  tables_dir: outputs/tables/02_preprocessing

# Training/validation split of ESM25 (the test set is made of later ESM records, outside ESM25).
# Records are grouped by event (columns.event_id) and stratified by label.
split:
  validation_fraction: 0.2
  random_seed: 42
  output_file: data/splits/esm25_train_validation.csv
  tables_dir: outputs/tables/03_split

# Convolutional-recurrent network adapted from CRED (Mousavi et al., 2019): strided convolution +
# residual block per stage, bidirectional LSTM layers along time, mean over time, dense head.
# Dropout everywhere, so that MC dropout samples the whole network.
model:
  # One stage per entry; each stage halves frequencies and times. CRED: 8 and 16 filters, kernels 9 and 5.
  conv_filters: [8, 16]
  conv_kernels: [9, 5]
  recurrent_units: 64
  recurrent_layers: 2
  head_units: 64
  dropout:
    # Channel dropout after each convolutional stage.
    conv: 0.1
    recurrent: 0.3
    head: 0.5
  # Stochastic forward passes for MC dropout predictions.
  mc_samples: 50
  # Grad-CAM (Captum) on the last convolutional layer, maps for both classes over MC dropout passes.
  grad_cam:
    mc_samples: 20
    records_per_class: 1
  figures_dir: outputs/figures/04_model
  tables_dir: outputs/tables/04_model

# Training of the classifier (notebook 05). Each run is saved in runs_dir/<representation>_<date-time>/ with the
# configuration, the normalization statistics, the best model, the history per epoch and the figures.
training:
  representation: scalogram
  # dev_subset to test the pipeline, seisbench for the full ESM25.
  feature_source: dev_subset
  batch_size: 64
  # Adam, as in Shalabi et al.; learning rate halved when the validation loss does not improve for lr_patience epochs.
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  max_epochs: 50
  lr_factor: 0.5
  lr_patience: 3
  # Stop after this many epochs without improvement of the validation loss; the best model is kept.
  early_stopping_patience: 10
  num_workers: 0
  # auto = Apple GPU (mps) if available, then CUDA, then CPU.
  device: auto
  random_seed: 42
  # Bins of the expected calibration error (ECE).
  calibration_bins: 15
  runs_dir: runs

# Evaluation of a training run (notebook 06), from the validation predictions saved by notebook 05.
evaluation:
  # Run folder inside training.runs_dir, or latest = most recent run of training.representation.
  run: latest
  # deterministic_entropy: entropy of the deterministic prediction (baseline without MC dropout);
  # probability_std, predictive_entropy, mutual_information: from the MC dropout passes.
  uncertainty_measures: [deterministic_entropy, probability_std, predictive_entropy, mutual_information]
  # Groups of equal size, by increasing uncertainty, for the error rate.
  error_groups: 10
  # Rejection curves: records kept from 1 down to min_retained_fraction, in steps of retained_step.
  min_retained_fraction: 0.2
  retained_step: 0.05
  reported_retained_fractions: [0.9, 0.8, 0.7, 0.5]
  # Random-rejection baseline averaged over this many orderings.
  random_repeats: 50
  random_seed: 42

output:
  figures_dir: outputs/figures/01_exploration
  tables_dir: outputs/tables/01_exploration
